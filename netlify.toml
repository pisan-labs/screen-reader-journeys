# Netlify settings for the dashboard (web/). docs/deploy.md walks through the set-up.
# The owner imports the repository once, with Deploy Previews and branch deploys off (every build
# costs credits). Set VITE_API_URL, the Render service's address, in the site's environment
# variables; the build fails without it.

[build]
  base = "web"
  # Relative to base.
  publish = "dist"
  command = "npm run build"

# Public values only: the shared HintWise project and its anon key (claude-built-apps
# platform/supabase.json), public by design. Never the service-role key: the build refuses it.
[build.environment]
  NODE_VERSION = "22"
  VITE_SUPABASE_URL = "https://auth.hintwise.org"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE"

# The dashboard's one address, for production builds only: opened anywhere else (http,
# netlify.app, a deploy's own address), it moves there first, and sign-in returns there
# (web/src/canonical.ts, and dist/site.js). A production build without it fails. A Deploy
# Preview or branch deploy (both off) leaves it out, so it shows its own code; sign-in cannot
# return to such an address in any case (R18.1-5).
[context.production.environment]
  VITE_SITE_URL = "https://screen-reader-journeys.hintwise.org"

# One address for the app: the netlify.app name sends people to hintwise.org.
[[redirects]]
  from = "https://screen-reader-journeys.netlify.app/*"
  to = "https://screen-reader-journeys.hintwise.org/:splat"
  status = 301
  force = true

# Security headers for every response. The Content-Security-Policy is not here: the build writes
# it to dist/_headers, because it names this deployment's Supabase project and API exactly.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

# hw-events.js, the one script without a hash in its name, changes with deploys; let browsers
# check for new versions. Vite's bundles in /assets/ carry a hash in their names, so they never
# change.
[[headers]]
  for = "/hw-events.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
