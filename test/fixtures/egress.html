<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>srj egress test page</title>
  </head>
  <body>
    <main>
      <h1>Egress test page</h1>
      <p>The hosted server's network guard must stop every request below. The test server
      replaces INTERNAL_ORIGIN with the address of a service the page must not reach.</p>
      <img alt="" src="INTERNAL_ORIGIN/secret-image" />
      <iframe title="Internal page" src="INTERNAL_ORIGIN/secret-frame"></iframe>
      <button id="go">Fetch internal addresses</button>
      <p role="status" id="out"></p>
    </main>
    <script>
      document.getElementById("go").addEventListener("click", async () => {
        const urls = [
          "INTERNAL_ORIGIN/secret-fetch",
          `http://localhost:${location.port}/secret-localhost`,
          "http://169.254.169.254/latest/meta-data/",
        ];
        await Promise.allSettled(urls.map((url) => fetch(url)));
        try {
          new WebSocket(`ws://localhost:${location.port}/secret-socket`);
        } catch {}
        document.getElementById("out").textContent = "Done.";
      });
    </script>
  </body>
</html>
