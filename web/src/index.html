<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen reader journeys</title>
    <meta name="description" content="Run screen reader journeys against a site and read what a keyboard and screen reader user would hear." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="wrap header-row">
        <a class="site-name" href="#/">Screen reader journeys</a>
        <div id="account" class="account"></div>
      </div>
    </header>
    <main id="main" tabindex="-1" class="wrap">
      <!-- Errors are announced from here (role="alert"), progress from the status line. Both stay
           in the page, empty when there is nothing to say, so screen readers notice changes. -->
      <div id="alert" role="alert" class="alert"></div>
      <p id="status" role="status" class="status"></p>
      <div id="view">
        <h1 tabindex="-1">Screen reader journeys</h1>
        <p>Loading…</p>
        <noscript><p>This dashboard needs JavaScript.</p></noscript>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <p>
          The transcripts are evidence for a person reviewing a change. They do not replace testing
          with real screen readers, or with the people who use them.
        </p>
        <p><a href="licenses.txt">Third-party licences</a></p>
      </div>
    </footer>
  </body>
</html>
