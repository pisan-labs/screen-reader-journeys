# Supabase CLI settings for local development (`supabase start`) and `supabase db push`.
# Only the settings this project needs are here; the CLI uses its defaults for the rest. Full
# reference: https://supabase.com/docs/guides/local-development/cli/config
#
# The hosted project's auth settings (site URL, redirect URLs, sign-ups) are set in its dashboard;
# docs/deploy.md lists them.

project_id = "screen-reader-journeys"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project's major version (SHOW server_version; in its SQL editor).
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The dashboard's local address (cd web && npm run dev).
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600
