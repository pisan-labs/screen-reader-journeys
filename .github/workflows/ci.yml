name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # The dashboard (web/): its own dependencies, then lint, typecheck, coverage (at least 85%)
      # and build, the HintWise gates before every push.
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run coverage --prefix web
      - run: npm run build --prefix web
        env:
          VITE_API_URL: https://api.example.org
      - run: npx playwright install --with-deps chromium
      # Runs the walker and virtual modes against test/fixtures/, and tests the hosted service's
      # server, and the dashboard walked by keyboard with this tool.
      - run: npm test
      # Applies supabase/migrations to a throwaway PostgreSQL (preinstalled on the runner) and
      # checks its policies and queue.
      - run: npm run test:sql
