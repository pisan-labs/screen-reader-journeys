name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # The dashboard (web/): its own dependencies, then lint, typecheck, coverage (at least 85%)
      # and build, the HintWise gates before every push.
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run coverage --prefix web
      - run: npm run build --prefix web
        env:
          VITE_API_URL: https://api.example.org
      # The server and the tool: lint, and tsc checking their JavaScript from its JSDoc.
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # Every test (the walker and virtual modes against test/fixtures/, the hosted service's
      # server, and the dashboard walked by keyboard with this tool), failing if server/ falls
      # under 85% of lines, branches or functions.
      - run: npm run coverage
      # The root-only security tests, which the step above skips: runs as the run's user (10001),
      # its processes and how the worker stops them, as root, as in the Docker image. The run's
      # user must reach the checkout and the browser, so the checkout's folders are opened for
      # traversal and Chromium goes to a shared folder.
      - name: Root-only tests (as root)
        run: |
          dir="$GITHUB_WORKSPACE"
          while [ "$dir" != / ]; do sudo chmod o+x "$dir"; dir="$(dirname "$dir")"; done
          sudo env "PATH=$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install chromium
          sudo env "PATH=$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers node --test test/server-reports.test.js test/server-worker.test.js
      # Applies supabase/migrations to a throwaway PostgreSQL (preinstalled on the runner) and
      # checks its policies and queue.
      - run: npm run test:sql
