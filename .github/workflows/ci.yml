name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs the walker and virtual modes against test/fixtures/basic.html, and tests the hosted
      # service's server and dashboard.
      - run: npm test
      # Applies supabase/migrations to a throwaway PostgreSQL (preinstalled on the runner) and
      # checks its policies and queue.
      - run: npm run test:sql
