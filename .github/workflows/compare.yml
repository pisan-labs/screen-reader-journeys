# Run the same journeys with every screen reader this tool can drive on GitHub's machines (the
# walker and the emulated screen reader on Ubuntu, real Orca on Ubuntu 26.04, real NVDA on
# Windows), then line up what each one heard, step by step.
#
# Start it by hand from the Actions tab with a site address, or call it from another repository:
#   uses: pisan-labs/screen-reader-journeys/.github/workflows/compare.yml@main
# The artifact "screen-reader-comparison" holds every run's reports and compare.md / compare.html.
name: Compare screen readers

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test, e.g. https://frontend-git-<branch>-stem-accessibility.vercel.app"
        required: true
      journeys:
        description: "Journey files or folders, separated by spaces"
        default: "targets/stem-accessibility"
  workflow_call:
    inputs:
      base_url:
        type: string
        required: true
      journeys:
        type: string
        default: "targets/stem-accessibility"
      tool_ref:
        description: "Version of this tool to use"
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  emulated:
    uses: ./.github/workflows/evaluate.yml
    with:
      base_url: ${{ inputs.base_url }}
      journeys: ${{ inputs.journeys }}
      modes: "walker,virtual"
      tool_ref: ${{ inputs.tool_ref || github.sha }}

  orca:
    uses: ./.github/workflows/orca.yml
    with:
      base_url: ${{ inputs.base_url }}
      journeys: ${{ inputs.journeys }}
      tool_ref: ${{ inputs.tool_ref || github.sha }}

  nvda:
    uses: ./.github/workflows/nvda.yml
    with:
      base_url: ${{ inputs.base_url }}
      journeys: ${{ inputs.journeys }}
      tool_ref: ${{ inputs.tool_ref || github.sha }}

  compare:
    needs: [emulated, orca, nvda]
    # Compare whatever ran, even when a journey failed or a screen reader did not start.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pisan-labs/screen-reader-journeys
          ref: ${{ inputs.tool_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One folder per run: screen-reader-journeys-reports, orca-reports, nvda-reports.
      - uses: actions/download-artifact@v4
        with:
          pattern: "*reports"
          path: all
      - name: Compare
        run: node src/cli.js compare all --out all
      - name: Summary
        if: always()
        run: cat all/compare.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-reader-comparison
          path: all
