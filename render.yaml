# Render settings for the hosted service; docs/deploy.md walks through them. One Docker web
# service runs the HTTP API and the worker. For the HintWise deployment PManager creates the
# service from claude-built-apps, with these settings. Secrets are not in this file: each
# `sync: false` value is set in the service's environment. There is no service-role key.
services:
  - type: web
    name: screen-reader-journeys
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The free instance costs nothing, but sleeps after 15 minutes without requests (queued runs
    # wait until the next request wakes it) and has 512 MB, which Chromium can exceed on large
    # pages. For regular use choose "standard" (2 GB). See docs/deploy.md.
    plan: free
    # Near the shared Supabase project (us-east-1).
    region: virginia
    # The worker runs one run at a time per instance; keep a single instance.
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # The worker's proof to the worker_* functions; only its SHA-256 is in the database.
      - key: WORKER_TOKEN
        sync: false
      # The dashboard's origin: https://screen-reader-journeys.hintwise.org
      - key: ALLOWED_ORIGINS
        sync: false
      # Sites the server may test, comma-separated: exact hosts, or "*." for subdomains, e.g.
      # stem-accessibility.example.org. Empty allows nothing. Prefer exact hosts: *.vercel.app
      # would admit anyone's Vercel deployment.
      - key: ALLOWED_TARGET_HOSTS
        sync: false
      - key: RUN_TIMEOUT_SECONDS
        value: "900"
      - key: POLL_INTERVAL_SECONDS
        value: "5"
